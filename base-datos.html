<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>SIG Ubaté - Base de Datos</title>
  <link rel="stylesheet" href="css/estilos.css"/>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <h1>🗺️ SIG Ubaté</h1>
      <span>Sistema de Información Geográfica Municipal</span>
    </div>
    <nav>
      <a href="index.html">Mapa</a>
      <a href="base-datos.html" class="activo">Base de Datos</a>
    </nav>
    <div class="usuario-info">
      <span id="nombre-usuario">👤 Usuario</span>
      <button onclick="cerrarSesion()" class="btn-salir">Salir</button>
    </div>
  </header>

  <!-- CONTENIDO -->
  <main class="contenedor-bd">

    <div class="tarjeta">
      <h2>📊 Tabla: predios_ubate</h2>
      <p style="margin-bottom:14px; color:#555; font-size:13px;">
        Simulación de la tabla PostGIS. En producción: <code>SELECT * FROM predios_ubate;</code>
      </p>
      <table id="tabla-predios">
        <thead>
          <tr>
            <th>ID</th>
            <th>Propietario</th>
            <th>Uso</th>
            <th>Área (m²)</th>
            <th>Lat</th>
            <th>Lng</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="tarjeta">
      <h2>➕ Agregar / Editar predio</h2>
      <div class="form-grid">
        <input type="text"   id="f-id"          placeholder="ID (ej: UB-006)" />
        <input type="text"   id="f-propietario" placeholder="Propietario" />
        <select id="f-uso">
          <option>Residencial</option>
          <option>Comercial</option>
          <option>Institucional</option>
          <option>Agropecuario</option>
        </select>
        <input type="number" id="f-area" placeholder="Área (m²)" />
        <input type="number" step="0.0001" id="f-lat" placeholder="Latitud" />
        <input type="number" step="0.0001" id="f-lng" placeholder="Longitud" />
      </div>
      <button class="btn btn-verde" id="btn-guardar">💾 Guardar</button>
      <button class="btn btn-azul"  id="btn-limpiar">🧹 Limpiar</button>
    </div>

  </main>

  <script src="js/base-datos.js"></script>
</body>
</html>
